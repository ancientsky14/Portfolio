<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Three islands on jade — the Archipelago, reduced to a mark that still
       reads at 16px, where a lettered monogram turns to mud. -->
  <rect width="64" height="64" rx="14" fill="#0b6e5c"/>
  <circle cx="24" cy="22" r="7" fill="#ffffff"/>
  <circle cx="40" cy="35" r="9" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="24" cy="45" r="4.5" fill="#e8c08a"/>
</svg>
