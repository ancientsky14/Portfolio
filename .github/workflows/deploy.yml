# Builds the static export and publishes it to GitHub Pages.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Nothing else — no gh-pages branch, no token.
#
# The site is served from https://ancientsky14.github.io/Portfolio/, so the
# build runs with NEXT_PUBLIC_BASE_PATH=/Portfolio. If the site moves to a
# custom domain, set that variable to "" and add public/CNAME.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits rather than cancelling a deploy
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Portfolio
          NEXT_PUBLIC_SITE_URL: https://ancientsky14.github.io/Portfolio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
